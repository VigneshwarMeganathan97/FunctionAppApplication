name: Bicep Template Deployment

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  oidc:
    runs-on: windows-latest
    environment: OIDC

    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v4

      - name: Checkout Bicep Template Repo
        uses: actions/checkout@v4
        with:
          repository: VigneshwarMeganathan97/BicepTempate
          ref: main
          path: bicep-template
          token: ${{ secrets.PAT_TOKEN }}

      - name: Verify Files
        shell: pwsh
        run: |
          Write-Host "Listing all files:"
          Get-ChildItem ./bicep-template -Recurse

      - name: Show Workspace Location
        shell: pwsh
        run: |
          Write-Host "Workspace path: $env:GITHUB_WORKSPACE"
          Get-Location
          Get-ChildItem

      - name: Run PowerShell Script
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File "./bicep-template/Bicep_Template/Sample.ps1"
